ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public_html

    <Directory /var/www/html/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    # La app (app.utntracker.com.ar y staging) no se indexa: lo que tiene que aparecer en
    # Google es la landing de utntracker.com.ar (site/, en Cloudflare Pages). Va como header
    # y no en un robots.txt con Disallow, porque si Google no puede rastrear la página
    # tampoco ve el noindex y la puede seguir mostrando.
    Header always set X-Robots-Tag "noindex"

    # Caché del navegador y de Cloudflare. La API arma sus propios Cache-Control en PHP
    # (no-store por defecto, público solo para el catálogo; ver src/Http/Response.php).
    #
    # HTML: siempre revalidar (ETag), así un deploy se ve al toque.
    # Lo mismo para el service worker y el manifest de la PWA: si Cloudflare o el
    # navegador se quedan con un sw.js viejo, la app no se actualiza.
    <FilesMatch "(\.html|^sw\.js|\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    AddType application/manifest+json .webmanifest

    # Assets con ?v=<hash> (los agrega docker/version-assets.php en el build): la URL
    # cambia cuando cambia el contenido, así que se pueden cachear por un año.
    # Sin versión (ej. fuentes referenciadas desde el CSS): 1 día navegador, 7 días CDN.
    <LocationMatch "^/assets/">
        <If "%{QUERY_STRING} =~ /(^|&)v=/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </If>
        <Else>
            Header set Cache-Control "public, max-age=86400, s-maxage=604800"
        </Else>
    </LocationMatch>
</VirtualHost>
