ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public_html

    <Directory /var/www/html/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    # Caché del navegador y de Cloudflare. La API arma sus propios Cache-Control en PHP
    # (no-store por defecto, público solo para el catálogo; ver src/Http/Response.php).
    #
    # HTML: siempre revalidar (ETag), así un deploy se ve al toque.
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Assets con ?v=<hash> (los agrega docker/version-assets.php en el build): la URL
    # cambia cuando cambia el contenido, así que se pueden cachear por un año.
    # Sin versión (ej. fuentes referenciadas desde el CSS): 1 día navegador, 7 días CDN.
    <LocationMatch "^/assets/">
        <If "%{QUERY_STRING} =~ /(^|&)v=/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </If>
        <Else>
            Header set Cache-Control "public, max-age=86400, s-maxage=604800"
        </Else>
    </LocationMatch>
</VirtualHost>
