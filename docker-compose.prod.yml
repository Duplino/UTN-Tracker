services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Root no se usa para nada (la app se conecta como DB_USER, y el puerto
      # no está publicado) más que para el bootstrap del contenedor: reusamos
      # DB_PASSWORD en vez de pedir otro secret separado en el .env.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB:?falta DB en .env}
      MYSQL_USER: ${DB_USER:?falta DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      # El esquema y los datos iniciales los carga la app al arrancar
      # (bin/migrate.php con database/migrations/), no el entrypoint de MySQL.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    # Nombre con el que Caddy alcanza la app (reverse_proxy <nombre>:80).
    # Staging usa este mismo archivo con APP_CONTAINER_NAME=utntracker-app-staging
    # en su .env, para poder correr los dos en el mismo VPS sin que choquen.
    container_name: ${APP_CONTAINER_NAME:-utntracker-app}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_IP: db
      MYSQL_PORT: 3306
      DB: ${DB:?falta DB en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID en .env}
      # Forzado a false: en producción no debe existir el bypass de Google login,
      # sin importar lo que diga el .env.
      MOCK_AUTH_ENABLED: "false"
    networks:
      - default
      - caddy_net
    # No se publica ningún puerto al host: Caddy llega por la red compartida
    # usando el nombre del contenedor (APP_CONTAINER_NAME:80).

networks:
  caddy_net:
    external: true
    # Red donde corre Caddy, definida en el .env (`docker network ls` en el VPS).
    name: ${CADDY_NETWORK:?falta CADDY_NETWORK en .env (docker network ls para ver la red de Caddy)}

volumes:
  db_data:
