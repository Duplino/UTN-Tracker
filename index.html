<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTN-Tracker se mudó</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1115;
            color: #eaeaea;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 480px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p {
            line-height: 1.5;
            color: #b7b7b7;
        }
        a.button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.75rem;
            background: #6c5ce7;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        a.button:hover {
            background: #5849c4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nos mudamos</h1>
        <p>
            UTN-Tracker ahora vive en <strong>utntracker.com.ar</strong>. Como
            parte de la migración a la nueva infraestructura, los datos
            cargados en esta versión (GitHub Pages) no pudieron conservarse.
        </p>
        <p>Pedimos disculpas por la molestia.</p>
        <a class="button" href="https://utntracker.com.ar">Ir a utntracker.com.ar</a>
    </div>
</body>
</html>
